<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Upload Dokumen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <h1 class="text-2xl font-bold mb-4">Dashboard Dokumen Terupload</h1>
  <div class="overflow-x-auto">
    <table class="table-auto w-full border-collapse border border-gray-300 bg-white shadow-md">
      <thead>
        <tr class="bg-gray-200">
          <th class="border p-2">No</th>
          <th class="border p-2">Nama</th>
          <th class="border p-2">Kategori</th>
          <th class="border p-2">Link Dokumen</th>
          <th class="border p-2">Tanggal Upload</th>
        </tr>
      </thead>
      <tbody id="dataBody"></tbody>
    </table>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch("YOUR_APPS_SCRIPT_URL?page=dashboard");
        const data = await response.json();

        const tbody = document.getElementById("dataBody");
        tbody.innerHTML = "";

        data.forEach((row, index) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="border p-2">${index + 1}</td>
            <td class="border p-2">${row.nama}</td>
            <td class="border p-2">${row.kategori}</td>
            <td class="border p-2"><a href="${row.link}" target="_blank" class="text-blue-600 underline">Lihat</a></td>
            <td class="border p-2">${row.tanggal}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        console.error("Gagal load data:", error);
      }
    }

    loadData();
  </script>
</body>
</html>
