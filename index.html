<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Dokumen Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
  <h1 class="text-2xl font-bold mb-4">Upload Dokumen Sekolah</h1>

  <form id="uploadForm" class="bg-white p-6 rounded-xl shadow-md w-full max-w-md space-y-4">
    <div>
      <label class="block mb-1 font-semibold">Nama</label>
      <input type="text" id="nama" name="nama" class="w-full border p-2 rounded" required>
    </div>

    <div>
      <label class="block mb-1 font-semibold">Kategori</label>
      <select id="kategori" name="kategori" class="w-full border p-2 rounded" required>
        <option value="RPP">RPP</option>
        <option value="Absen Harian">Absen Harian</option>
        <option value="Bukti Dukung">Bukti Dukung Lainnya</option>
      </select>
    </div>

    <div>
      <label class="block mb-1 font-semibold">File Dokumen</label>
      <input type="file" id="file" name="file" class="w-full border p-2 rounded" required>
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
      Upload
    </button>
  </form>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const nama = document.getElementById("nama").value;
      const kategori = document.getElementById("kategori").value;
      const fileInput = document.getElementById("file");

      if (!fileInput.files.length) {
        alert("Pilih file terlebih dahulu!");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = async function() {
        const base64Data = reader.result.split(",")[1]; // ambil base64

        try {
          const response = await fetch("https://script.google.com/macros/s/AKfycbz4S3KnavXSlunwonHRvXNnSKq0TtNV9KOFP5Bx3aKeDy3B0TnZZAcf9oji6HWkehyA9A/exec", {
            method: "POST",
            body: JSON.stringify({
              nama: nama,
              jenis: kategori,
              filename: file.name,
              mimeType: file.type,
              data: base64Data
            }),
            headers: {
              "Content-Type": "application/json"
            }
          });
          const result = await response.json();
          alert(result.message || "Upload berhasil!");
        } catch (error) {
          alert("Gagal upload: " + error);
        }
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
