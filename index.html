<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Upload Dokumen Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">

  <h1 class="text-2xl font-bold mb-6">📂 Upload Dokumen Sekolah</h1>

  <form id="uploadForm" class="bg-white p-6 rounded-lg shadow-md w-full max-w-md space-y-4">
    <input type="text" name="nama" placeholder="Nama Pengupload"
           class="w-full p-2 border rounded" required>

    <select name="kategori" class="w-full p-2 border rounded" required>
      <option value="">-- Pilih Kategori --</option>
      <option value="RPP">RPP</option>
      <option value="Absen Harian">Absen Harian</option>
      <option value="Bukti Dukung">Bukti Dukung</option>
    </select>

    <input type="file" name="fileUpload" class="w-full p-2 border rounded" required>

    <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
      Upload
    </button>
  </form>

  <p id="status" class="mt-4 text-center"></p>

  <script>
    const form = document.getElementById("uploadForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("status").innerText = "⏳ Uploading...";
      
      const nama = form.nama.value;
      const kategori = form.kategori.value;
      const file = form.fileUpload.files[0];

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = {
          nama,
          kategori,
          fileUpload: Utilities.newBlob(
            [...new Uint8Array(e.target.result)],
            file.type,
            file.name
          )
        };

        google.script.run.withSuccessHandler((msg) => {
          document.getElementById("status").innerText = msg;
          form.reset();
        }).uploadFile(data);
      };
      reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
